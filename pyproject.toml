[project]
name = "aiws"
version = "0.1.0"
description = "AI Workstation: bots deterministas + operación (Hermes, Codex, Claude)"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2", "duckdb>=1.1", "openpyxl>=3.1", "matplotlib>=3.9",
  "httpx>=0.27", "pydantic>=2.8", "pydantic-settings>=2.4", "pyyaml>=6",
  "jupyterlab>=4",
]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
[project.scripts]
aiws = "aiws.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/aiws"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
