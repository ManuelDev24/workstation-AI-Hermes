[project]
name = "dataapp-template"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2"]
[project.scripts]
dataapp = "dataapp.main:main"
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/dataapp"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
[tool.ruff]
line-length = 100
