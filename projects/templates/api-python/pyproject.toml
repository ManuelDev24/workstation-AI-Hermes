[project]
name = "api-template"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4"]
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
[tool.ruff]
line-length = 100
